<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Deposit History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
            background: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .back-btn {
            position: absolute;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background-color: #28a745;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background-color: #218838;
        }

        .header h1 {
            font-size: 22px;
            color: #2c3e50;
        }

        .table-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .user-name {
            font-weight: 600;
            color: #2c3e50;
        }
        .user-email {
            font-size: 12px;
            color: #6c757d;
        }
        .user-uid {
            font-size: 10px;
            color: #a0a0a0;
            font-family: monospace;
        }

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            text-transform: capitalize;
        }
        .status.approved, .status.success { background: #d4edda; color: #155724; }
        .status.pending { background: #fff3cd; color: #856404; }
        .status.rejected, .status.failed { background: #f8d7da; color: #721c24; }

        #loading {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="javascript:history.back()" class="back-btn">&#8592; Back</a>
        <h1>Deposit History (Admin)</h1>
    </div>

    <div class="table-container">
        <div id="loading">ডিপোজিট হিস্ট্রি লোড হচ্ছে...</div>
        <table id="depositTable" style="display: none;">
            <thead>
                <tr>
                    <th>User Details</th>
                    <th>Payment Method</th>
                    <th>Transaction ID</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date / Time</th>
                </tr>
            </thead>
            <tbody id="depositList">
            </tbody>
        </table>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz-zkj7o-5w47U2AFAdXWvpa0uYaF9VFw",
            authDomain: "mail-shop-bd.firebaseapp.com",
            databaseURL: "https://mail-shop-bd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mail-shop-bd",
            storageBucket: "mail-shop-bd.firebasestorage.app",
            messagingSenderId: "19603951400",
            appId: "1:19603951400:web:4eedb894f65ba908898a1d",
            measurementId: "G-5T3HESJSW2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const depositList = document.getElementById('depositList');
        const loading = document.getElementById('loading');
        const depositTable = document.getElementById('depositTable');

        // users নোড থেকে ইউজার এবং তাদের deposit_history ফেস করা
        const usersRef = ref(db, 'users');

        onValue(usersRef, (snapshot) => {
            depositList.innerHTML = '';
            
            if (snapshot.exists()) {
                const usersData = snapshot.val();
                let allDeposits = [];

                // সকল ইউজারের deposit_history ডাটা একত্র করা
                Object.keys(usersData).forEach((userId) => {
                    const userData = usersData[userId];
                    
                    if (userData.deposit_history) {
                        Object.keys(userData.deposit_history).forEach((depositId) => {
                            const dep = userData.deposit_history[depositId];
                            allDeposits.push({
                                userId: userId,
                                username: userData.username || 'N/A',
                                email: dep.email || userData.email || 'N/A',
                                method: dep.method || 'N/A',
                                trxId: dep.trxId || dep.trxID || dep.transactionId || 'N/A',
                                amount: dep.amount || '0',
                                status: dep.status || 'success',
                                timestamp: dep.timestamp || dep.date || 'N/A'
                            });
                        });
                    }
                });

                if (allDeposits.length === 0) {
                    loading.innerText = 'কোনো ডিপোজিট হিস্ট্রি পাওয়া যায়নি!';
                    return;
                }

                // হিস্ট্রি টেবিল রেন্ডার করা
                allDeposits.forEach((deposit) => {
                    let statusClass = deposit.status.toLowerCase();

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="user-info">
                                <span class="user-name">${deposit.username}</span>
                                <span class="user-email">${deposit.email}</span>
                                <span class="user-uid">UID: ${deposit.userId}</span>
                            </div>
                        </td>
                        <td><strong>${deposit.method.toUpperCase()}</strong></td>
                        <td><code>${deposit.trxId}</code></td>
                        <td>৳${deposit.amount}</td>
                        <td><span class="status ${statusClass}">${deposit.status}</span></td>
                        <td>${deposit.timestamp}</td>
                    `;
                    depositList.appendChild(tr);
                });

                loading.style.display = 'none';
                depositTable.style.display = 'table';
            } else {
                loading.innerText = 'কোনো তথ্য পাওয়া যায়নি!';
            }
        }, (error) => {
            loading.innerText = 'ডাটা লোড করতে সমস্যা হয়েছে: ' + error.message;
        });
    </script>
</body>
</html>
