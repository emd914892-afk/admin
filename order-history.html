<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - All Order History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        /* হেডার ও ব্যাক বাটন স্টাইল */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
            background: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .back-btn {
            position: absolute;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background-color: #0056b3;
        }

        .header h1 {
            font-size: 22px;
            color: #2c3e50;
        }

        /* টেবিল কন্টেইনার */
        .table-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .delivered-code {
            background: #27272a;
            color: #38bdf8;
            padding: 6px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-width: 200px;
            word-break: break-all;
            display: inline-block;
        }

        /* স্ট্যাটাস ব্যাজ */
        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .status.pending { background: #ffeaa7; color: #d63031; }
        .status.completed { background: #55efc4; color: #00b894; }

        /* লোডার */
        #loading {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="javascript:history.back()" class="back-btn">&#8592; Back</a>
        <h1>All Order History (Admin Panel)</h1>
    </div>

    <div class="table-container">
        <div id="loading">অর্ডার লোড হচ্ছে...</div>
        <table id="orderTable" style="display: none;">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>User ID / Email</th>
                    <th>Product / Category</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Delivered Data</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="orderList">
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAz-zkj7o-5w47U2AFAdXWvpa0uYaF9VFw",
            authDomain: "mail-shop-bd.firebaseapp.com",
            databaseURL: "https://mail-shop-bd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mail-shop-bd",
            storageBucket: "mail-shop-bd.firebasestorage.app",
            messagingSenderId: "19603951400",
            appId: "1:19603951400:web:4eedb894f65ba908898a1d",
            measurementId: "G-5T3HESJSW2"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const orderList = document.getElementById('orderList');
        const loading = document.getElementById('loading');
        const orderTable = document.getElementById('orderTable');

        // Fetch data from 'orders' and 'user_orders'
        const ordersRef = ref(db, 'orders');
        const userOrdersRef = ref(db, 'user_orders');

        function loadAllAdminOrders() {
            let ordersData = {};
            let userOrdersData = {};

            let ordersLoaded = false;
            let userOrdersLoaded = false;

            const renderData = () => {
                if (!ordersLoaded || !userOrdersLoaded) return;

                const combinedOrders = {};

                // 1. Map 'orders' node
                Object.keys(ordersData).forEach(key => {
                    combinedOrders[key] = { id: key, ...ordersData[key] };
                });

                // 2. Map 'user_orders' node
                Object.keys(userOrdersData).forEach(userId => {
                    const userGroup = userOrdersData[userId];
                    if (typeof userGroup === 'object') {
                        Object.keys(userGroup).forEach(orderId => {
                            combinedOrders[orderId] = {
                                ...(combinedOrders[orderId] || {}),
                                id: orderId,
                                ...userGroup[orderId]
                            };
                        });
                    }
                });

                const allOrdersList = Object.values(combinedOrders);

                if (allOrdersList.length === 0) {
                    loading.innerText = 'কোনো অর্ডার পাওয়া যায়নি!';
                    orderTable.style.display = 'none';
                    return;
                }

                // Sort by Latest Order First
                allOrdersList.sort((a, b) => {
                    const timeA = a.timestamp || (a.date ? new Date(a.date).getTime() : 0);
                    const timeB = b.timestamp || (b.date ? new Date(b.date).getTime() : 0);
                    return timeB - timeA;
                });

                orderList.innerHTML = '';
                allOrdersList.forEach(order => {
                    // Delivered Data Formatting
                    let deliveredText = 'N/A';
                    if (Array.isArray(order.deliveredData)) {
                        deliveredText = order.deliveredData.join('<br>');
                    } else if (typeof order.deliveredData === 'object' && order.deliveredData !== null) {
                        deliveredText = Object.values(order.deliveredData).join('<br>');
                    } else if (order.deliveredData) {
                        deliveredText = order.deliveredData;
                    }

                    // Date Formatting
                    let dateDisplay = 'N/A';
                    if (order.date) {
                        dateDisplay = new Date(order.date).toLocaleString();
                    } else if (order.timestamp) {
                        dateDisplay = new Date(order.timestamp).toLocaleString();
                    }

                    const userIdentifier = order.userEmail || order.userId || 'N/A';
                    const title = order.title || order.category || 'N/A';
                    const price = order.totalPrice !== undefined ? order.totalPrice : (order.totalAmount || order.price || 0);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>#${order.id.slice(-6)}</strong></td>
                        <td>${userIdentifier}</td>
                        <td>${title}</td>
                        <td>${order.quantity || 1}</td>
                        <td>৳ ${price}</td>
                        <td><div class="delivered-code">${deliveredText}</div></td>
                        <td>${dateDisplay}</td>
                    `;
                    orderList.appendChild(tr);
                });

                loading.style.display = 'none';
                orderTable.style.display = 'table';
            };

            // Realtime listeners for both nodes
            onValue(ordersRef, snapshot => {
                ordersData = snapshot.exists() ? snapshot.val() : {};
                ordersLoaded = true;
                renderData();
            }, error => {
                loading.innerText = 'ডাটা লোড করতে সমস্যা হয়েছে: ' + error.message;
            });

            onValue(userOrdersRef, snapshot => {
                userOrdersData = snapshot.exists() ? snapshot.val() : {};
                userOrdersLoaded = true;
                renderData();
            }, error => {
                loading.innerText = 'ডাটা লোড করতে সমস্যা হয়েছে: ' + error.message;
            });
        }

        loadAllAdminOrders();
    </script>
</body>
</html>
