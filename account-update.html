<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Payment Number - Mail Shop BD</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Header Bar */
    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }
    .back-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #3b82f6;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background-color: #334155;
    }
    .top-title {
      font-size: 18px;
      font-weight: 600;
      color: #f8fafc;
    }

    /* Main Form Card */
    .card {
      background-color: #1e293b;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input:focus {
      border-color: #3b82f6;
    }

    /* Update Button */
    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    /* Alert Message */
    .alert {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .alert-success {
      background-color: #065f46;
      color: #34d399;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="top-title">Update Payment Number</div>
    <div style="width: 40px;"></div>
  </div>

  <!-- Form Card -->
  <div class="card">
    <div class="form-group">
      <label for="methodSelect">Select Payment Method</label>
      <select id="methodSelect">
        <option value="bkash">bKash</option>
        <option value="nagad">Nagad</option>
        <option value="rocket">Rocket</option>
      </select>
    </div>

    <div class="form-group">
      <label for="numberInput">Current/New Number</label>
      <input type="text" id="numberInput" placeholder="Fetching number...">
    </div>

    <button class="submit-btn" id="updateBtn">
      <i class="fa-solid fa-pen-to-square"></i> Update Number
    </button>

    <div class="alert alert-success" id="alertMsg">
      Number updated successfully!
    </div>
  </div>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAz-zkj7o-5w47U2AFAdXWvpa0uYaF9VFw",
      authDomain: "mail-shop-bd.firebaseapp.com",
      databaseURL: "https://mail-shop-bd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mail-shop-bd",
      storageBucket: "mail-shop-bd.firebasestorage.app",
      messagingSenderId: "19603951400",
      appId: "1:19603951400:web:4eedb894f65ba908898a1d",
      measurementId: "G-5T3HESJSW2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const methodSelect = document.getElementById('methodSelect');
    const numberInput = document.getElementById('numberInput');
    const updateBtn = document.getElementById('updateBtn');
    const alertMsg = document.getElementById('alertMsg');

    // 🔴 Auth Security Check
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "index.html"; // লগইন না থাকলে সরাসরি index.html এ পাঠাবে
      } else {
        // লগইন থাকলে ডাটা ফেচ করবে
        fetchCurrentNumber(methodSelect.value);
      }
    });

    // ডাটাবেস থেকে নম্বর ফেচ করার ফাংশন
    function fetchCurrentNumber(method) {
      numberInput.value = "Loading...";
      db.ref('payment_methods/' + method).once('value').then(snapshot => {
        if (snapshot.exists()) {
          numberInput.value = snapshot.val();
        } else {
          numberInput.value = "";
        }
      }).catch(err => {
        console.error(err);
        numberInput.value = "";
      });
    }

    // ড্রপডাউন পরিবর্তন হলে সাথে সাথে আপডেট হওয়া নম্বর আনবে
    methodSelect.addEventListener('change', (e) => {
      fetchCurrentNumber(e.target.value);
    });

    // নম্বর আপডেট করার লজিক
    updateBtn.addEventListener('click', () => {
      const selectedMethod = methodSelect.value;
      const newNumber = numberInput.value.trim();

      if (!newNumber) {
        alert("দয়া করে একটি সঠিক নম্বর লিখুন!");
        return;
      }

      db.ref('payment_methods/' + selectedMethod).set(newNumber).then(() => {
        alertMsg.style.display = 'block';
        setTimeout(() => {
          alertMsg.style.display = 'none';
        }, 3000);
      }).catch(err => {
        alert("আপডেট করতে সমস্যা হয়েছে: " + err.message);
      });
    });
  </script>
</body>
</html>
