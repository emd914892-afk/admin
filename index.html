<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Shop BD - Admin Login</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background-color: #1e293b;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      color: #3b82f6;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 5px;
    }
    .input-group {
      margin-bottom: 18px;
      position: relative;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-group input {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #3b82f6;
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-submit {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #toast {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    .toast-success {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .toast-error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .toast-info {
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Global Shop BD</h1>
      <p>Admin Login Only</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <form id="loginForm">
      
      <!-- Username or Email Field -->
      <div class="input-group">
        <label>Email / Username</label>
        <input type="text" id="identifier" required placeholder="Enter admin email or username" autocomplete="off">
      </div>

      <!-- Password Field -->
      <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" required placeholder="••••••••">
          <button type="button" id="togglePassword" class="toggle-password">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="btn-submit">Login</button>

    </form>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAz-zkj7o-5w47U2AFAdXWvpa0uYaF9VFw",
      authDomain: "mail-shop-bd.firebaseapp.com",
      databaseURL: "https://mail-shop-bd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mail-shop-bd",
      storageBucket: "mail-shop-bd.firebasestorage.app",
      messagingSenderId: "19603951400",
      appId: "1:19603951400:web:4eedb894f65ba908898a1d",
      measurementId: "G-5T3HESJSW2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Session persistence set to LOCAL
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const identifierInput = document.getElementById('identifier');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');

    function showNotification(message, type = 'info') {
      toast.textContent = message;
      toast.style.display = 'block';
      toast.className = '';
      
      if (type === 'error') {
        toast.classList.add('toast-error');
      } else if (type === 'success') {
        toast.classList.add('toast-success');
      } else {
        toast.classList.add('toast-info');
      }
    }

    // Password Show/Hide Toggle
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.classList.toggle('fa-eye');
      eyeIcon.classList.toggle('fa-eye-slash');
    });

    // Login Form Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      let identifier = identifierInput.value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Checking Admin...";

      try {
        let emailToLogin = identifier;

        // ইউজারনেম ইনপুট দিলে ডাটাবেজ থেকে ইমেইল বের করে আনা
        if (!identifier.includes('@')) {
          const snapshot = await db.ref('usernames/' + identifier.toLowerCase()).once('value');
          if (!snapshot.exists()) {
            throw new Error("Account Not Found");
          }
          const uid = snapshot.val();
          const userSnap = await db.ref('users/' + uid).once('value');
          if (userSnap.exists()) {
            emailToLogin = userSnap.val().email;
          } else {
            throw new Error("Account Not Found");
          }
        }

        // Firebase Auth Login
        const userCredential = await auth.signInWithEmailAndPassword(emailToLogin, password);
        const user = userCredential.user;

        // 🔴 Admin Check (isAdmin === true)
        const adminSnap = await db.ref('users/' + user.uid).once('value');
        if (adminSnap.exists()) {
          const userData = adminSnap.val();

          if (userData.isAdmin === true) {
            showNotification("Welcome Admin! Redirecting to Dashboard...", "success");
            setTimeout(() => {
              window.location.href = "dashboard.html"; // Admin Dashboard Page
            }, 1200);
          } else {
            await auth.signOut();
            showNotification("Access Denied! You are not an Admin.", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
          }
        } else {
          await auth.signOut();
          showNotification("Account Data Not Found", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Login";
        }

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";

        if (error.message === "Account Not Found" || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
          showNotification("Account Not Found", "error");
        } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          showNotification("Invalid Password", "error");
        } else {
          showNotification(error.message, "error");
        }
      }
    });
  </script>
</body>
</html>
